spring.application.name=vaultora-api
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/vaultora}
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
server.port=${PORT:8081}

# Required in every environment; use a random secret >= 32 bytes.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:1800000}
app.jwt.extension-expiration-ms=${JWT_EXTENSION_EXPIRATION_MS:600000}
app.cookie.secure=${COOKIE_SECURE:false}

# Production should set this to the exact deployed extension origin.
app.cors.extension-origin-pattern=${EXTENSION_ORIGIN_PATTERN:chrome-extension://*}
app.cors.web-origin=${WEB_ORIGIN:http://localhost:5173}

server.error.include-message=never
